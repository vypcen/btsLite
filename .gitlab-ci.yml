# То же для GitLab: линтер, типы, тесты на PostgreSQL, сборка и сканирование образа, публикация по тегу.
stages: [check, image]

variables:
  POSTGRES_PASSWORD: postgres
  TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres

check:
  stage: check
  image: node:24-bookworm
  services:
    - name: postgres:16-alpine
      alias: postgres
  cache:
    key: { files: [package-lock.json, web/package-lock.json] }
    paths: [.npm/]
  script:
    - curl --fail --silent --show-error -o /usr/share/keyrings/pgdg.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
    - echo 'deb [signed-by=/usr/share/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt bookworm-pgdg main' > /etc/apt/sources.list.d/pgdg.list
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client-16
    - timeout 60s sh -c 'until pg_isready -h postgres --timeout=3; do sleep 1; done'
    - npm ci --cache .npm --prefer-offline
    - npm --prefix web ci --cache .npm --prefer-offline
    - npm run lint
    - npm run typecheck
    - npm test
    - npx playwright install --with-deps chromium && npm run e2e
    - npm audit --omit=dev --audit-level=high && npm --prefix web audit --omit=dev --audit-level=high
  artifacts:
    when: on_failure
    paths: [test-results/]

image:
  stage: image
  image: docker:27
  services: [docker:27-dind]
  script:
    - docker build --build-arg BUILD_COMMIT="$CI_COMMIT_SHA" --build-arg BUILD_DATE="$CI_PIPELINE_CREATED_AT" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.0 image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG#v}"
        docker push "$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG#v}"
      fi
